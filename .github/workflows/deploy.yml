# Doc 3, Bloque 5 — Entrega continua.
#   merge a main  → despliegue automático a STAGING
#   tag vX.Y.Z    → despliegue a PRODUCCIÓN con aprobación manual
#
# Staging vive en Railway (decisión del usuario, 2026-10-23): el CLI sube el
# código y Railway construye el Dockerfile. Producción sigue sin proveedor.
# El workflow está APAGADO hasta que exista la variable de repositorio
# DESPLIEGUE_HABILITADO=true (paso a paso en docs/guia-validacion-telefono.md).
#
# Configuración en GitHub:
#   Settings → Environments → `staging` (y `production` cuando exista)
#     - secret DATABASE_URL: la URL PÚBLICA de Railway con el rol gestor_app,
#       NO superusuario (ver infra/README.md); el pipeline corre fuera de
#       Railway y no ve su red privada
#     - secret RAILWAY_TOKEN: token de proyecto del environment de staging
#     - en `production`: "Required reviewers" = el paso de aprobación manual
#   Settings → Variables → DESPLIEGUE_HABILITADO = true
name: Despliegue

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: despliegue-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staging:
    name: Staging (automático desde main)
    if: github.ref == 'refs/heads/main' && vars.DESPLIEGUE_HABILITADO == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Doc 8, Bloque 1: `prisma migrate deploy` como paso del pipeline antes
      # de cada despliegue, nunca al arrancar el contenedor.
      - name: Migraciones en staging
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Los orígenes de pago (Doc 4 Bloque 1). Es un upsert: correrla en cada
      # despliegue no duplica nada.
      - name: Semilla en staging
        run: npx prisma db seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # `--ci` espera el build y falla el job si Railway no logra construir.
      - name: Desplegar en Railway
        run: npx --yes @railway/cli@5 up --service backend --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  produccion:
    name: Producción (tag + aprobación manual)
    if: startsWith(github.ref, 'refs/tags/v') && vars.DESPLIEGUE_HABILITADO == 'true'
    runs-on: ubuntu-latest
    # El environment `production` con "Required reviewers" es el paso de
    # aprobación explícito que pide el Doc 3 para un equipo pequeño.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Migraciones en producción
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Desplegar en el proveedor de hosting
        run: |
          echo "::error::Producción todavía no tiene proveedor: staging usa Railway; decidirlo antes del primer tag."
          exit 1
